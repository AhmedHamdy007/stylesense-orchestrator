name: Deploy — Orchestrator

on:
  # Triggered by every service CI pipeline after a successful build
  repository_dispatch:
    types: [service-updated]

  # Manual trigger — full stack deploy when ready
  workflow_dispatch:
    inputs:
      service:
        description: "Service name to deploy (leave empty = full stack)"
        required: false
        default: ""

jobs:
  # ── Receives dispatch from service repos ────────────────────
  log-deployment:
    name: Log incoming deploy event
    runs-on: ubuntu-latest

    steps:
      - name: Show deploy payload
        run: |
          echo "============================================"
          echo "  DEPLOY EVENT RECEIVED"
          echo "============================================"
          echo "  Service  : ${{ github.event.client_payload.service }}"
          echo "  Image    : ${{ github.event.client_payload.image }}"
          echo "  Tag      : ${{ github.event.client_payload.tag }}"
          echo "  Commit   : ${{ github.event.client_payload.sha }}"
          echo "  Actor    : ${{ github.event.client_payload.actor }}"
          echo "  Time     : $(date -u)"
          echo "============================================"

      - name: Checkout orchestrator repo
        uses: actions/checkout@v4

      - name: Validate service name
        run: |
          SERVICE="${{ github.event.client_payload.service }}"
          VALID_SERVICES="auth-service booking-service shop-service messaging-service inventory-service notification-service node-service python-sidecar api-gateway dashboard-service"
          if echo "$VALID_SERVICES" | grep -qw "$SERVICE"; then
            echo "✅ Valid service: $SERVICE"
          else
            echo "⚠️  Unknown service: $SERVICE — skipping deploy"
            exit 0
          fi

      - name: Simulate deploy step
        run: |
          echo ""
          echo "🚀 Would deploy:"
          echo "   docker pull ${{ github.event.client_payload.image }}:${{ github.event.client_payload.tag }}"
          echo "   docker compose up -d --no-deps --force-recreate --no-build ${{ github.event.client_payload.service }}"
          echo ""
          echo "✅ Pipeline complete — VM deploy not yet configured"

  # ── Summary job — shows all active image tags ───────────────
  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: log-deployment

    steps:
      - name: Print summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deploy Event — ${{ github.event.client_payload.service }}

          | Field   | Value |
          |---------|-------|
          | Service | \`${{ github.event.client_payload.service }}\` |
          | Image   | \`${{ github.event.client_payload.image }}\` |
          | Tag     | \`${{ github.event.client_payload.tag }}\` |
          | Commit  | \`${{ github.event.client_payload.sha }}\` |
          | Actor   | ${{ github.event.client_payload.actor }} |
          | Time    | $(date -u) |

          > VM deploy will be wired here when infrastructure is ready.
          EOF
